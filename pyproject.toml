[project]
name = "quantbox"
version = "0.12.0"
description = "Quant research & trading core with plugin marketplace (entry points)."
requires-python = ">=3.10"
# The base install is what the CORE layer imports (ADR-0010 decision 4,
# TOM-1451): a client install (robo) gets core and nothing else. A library a
# core module does not import belongs in an extra below. This file is the one
# owner of every list; docs point here.
dependencies = [
  "pandas>=2.3.3",
  # The floor is the lowest numpy the suite was run on, not the lock's version:
  # the full suite passes on 1.26.4 and on 2.1.3 (TOM-1451). No core code needs
  # numpy 2. A client caps numpy below 2.2 (robo), so do not raise it lightly.
  "numpy>=2.2.6",
  "scipy>=1.15.3",
  "pyarrow>=25.0.1",
  "pyyaml>=6.0.3",
  "jsonschema>=4.26.0",
  "statsmodels>=0.15.0",
  "pandas-market-calendars>=5.5.0",
  "typer>=0.27.3",
]

[project.optional-dependencies]
# Per-audience extras (ADR-0010). Without one, a module that needs it raises
# MissingExtraError naming it, on import or on use; it never fails bare.
# [data]: the data-source clients (datasources, market_cap, the duckdb store).
data = ["duckdb>=1.5.6", "httpx>=0.28.1", "pycoingecko>=3.2.0", "requests>=2.34.2"]
# [research]: the research layer's libraries (reports need plotly) plus [data].
research = ["quantbox[data]", "plotly>=7.1.0"]
# [trade]: the venue clients brokers and publishers import. requests is
# declared, not borrowed from ccxt: the Binance-futures and Hyperliquid brokers
# import it for their Telegram notices.
trade = ["ccxt>=4.5.85", "httpx>=0.28.1", "requests>=2.34.2"]
# The vectorbt backtest engine (quantbox.bt, adapters.vectorbt, run_vectorbt,
# engine: vectorbt, quantbox.sweep sweep/run_grid). Without it those raise
# MissingExtraError naming this extra; everything else imports (TOM-1334).
vectorbt = ["vectorbt>=1.0.0", "numba>=0.68.0"]
ibkr = ["ib_insync"]
binance = ["python-binance"]
ccxt = ["ccxt>=4.5.85"]
ml = ["scikit-learn>=1.7.2"]
simulation = ["arch>=8.0"]
viz = ["matplotlib>=3.10.9", "seaborn>=0.13.2"]
full = ["quantbox[data,research,trade,vectorbt,ibkr,binance,ccxt,ml,simulation,viz]"]

[project.scripts]
quantbox = "quantbox.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # The suite exercises the vectorbt engine, so the dev env carries the
    # [vectorbt] extra's pins; the no-vectorbt path is proven by
    # tests/test_without_vectorbt.py and the ci.yml `no-vectorbt` job.
    # [research] (which includes [data]) is what the old base install carried
    # beyond core: the suite exercises datasources, the store and reports.
    "quantbox[research,vectorbt]",
    "commitizen>=4.19.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "import-linter>=2.15",
]

[tool.uv]
# CVE-2026-104874 (multidict HIGH, fixed in 6.9.1): ccxt pins multidict==6.7.1 exactly — remove when ccxt relaxes its multidict pin.
# The <7 cap keeps aiohttp's own bound (multidict<7.0), which an override would otherwise erase.
override-dependencies = ["multidict>=6.9.1,<7"]

[tool.uv_build]
package-data = { quantbox = ["artifact_schemas/*.schema.json", "line_template/*.tmpl"], "quantbox.plugins" = ["manifest.yaml", "manifest.schema.json"] }

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    "cookbook/configs/",
    # Agent tooling, not Python source. It also carries committed symlinks that
    # point outside the repo, so ruff format --check dies reading them ("io: No
    # such file or directory") and lint goes red on a clean clone regardless of
    # any formatting question. ruff has no business walking this directory.
    ".claude/",
    # Nested worktrees are separate checkouts; linting them lints another
    # branch and, worse,  REWRITES files someone else is editing.
    ".worktrees/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length handled by formatter
    "E741",    # ambiguous variable name (common in quant: l, O, I)
    "B008",    # function call in default arg (typer uses this)
    "SIM108",  # ternary — readability preference
]

[tool.ruff.lint.per-file-ignores]
"src/quantbox/plugins/strategies/crypto_trend.py" = ["E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["quantbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# NO `addopts` deselection on purpose. A bare `pytest` must run EVERY test:
# a default that silently skips is indistinguishable from a suite that passes.
# Selection is the caller's job — the pre-push hook narrows it, CI does not.
markers = [
    "pipeline_smoke: end-to-end pipeline tests (slow). Run via `pytest -m pipeline_smoke`.",
    "canonical_reproduction: end-to-end backtests against committed goldens. Run via `pytest -m canonical_reproduction`.",
    "slow: takes multiple seconds — relocated to CI by the pre-push hook, never weakened. Run via `pytest -m slow`.",
]

[tool.importlinter]
# THE LAYER MAP (ADR-0010, TOM-1451). These contracts are its one owner: docs,
# tests and scripts/check_no_vectorbt.sh read it from here (scripts/layer_map.py).
# Layers, in import order: core < plugins < research, trade. A layer imports only
# the layers below it; research and trade never import each other.
#
# Each layer is the `source_modules` of its contract. tests/test_layer_map.py
# fails when a module under src/quantbox is in no layer or in two, and when a
# contract's `forbidden_modules` is not exactly the layers above its source.
#
# Why `forbidden` contracts, not one `layers` contract: the layers interleave in
# the package tree (quantbox.engine is core, quantbox.engine.vectorbt research;
# quantbox.plugins.builtins is core, its siblings are plugins, research or trade;
# the root package and the plugins.pipeline namespace hold several layers). A
# `layers` contract treats each entry as a package with all its descendants, so
# it cannot state that. Here `as_packages = false`: an entry is one module, and
# `X.**` adds every module below X.
root_package = "quantbox"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "core"
name = "core imports no plugins, research or trade module"
type = "forbidden"
as_packages = false
source_modules = [
  "quantbox",  # the package __init__ only
  "quantbox._deprecation",
  "quantbox._lazy",  # the one door from core to an upper layer: a string, loaded at run time
  "quantbox._numerics",
  "quantbox.analysis",  # deprecation shims onto inference and gates
  "quantbox.analysis.dsr",
  "quantbox.analysis.gates",
  "quantbox.analysis.hac",
  "quantbox.bootstrap",
  "quantbox.bootstrap.**",
  "quantbox.cache",  # StrategyCache: pandas + pyarrow only; robo (a client) imports it
  "quantbox.cache.**",
  "quantbox.cli",  # research and trade commands load through _lazy and name their extra
  "quantbox.config_checks",
  "quantbox.contracts",
  "quantbox.dataset",
