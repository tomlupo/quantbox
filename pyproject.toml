  "quantbox.decision",
  "quantbox.engine",  # the seam with the rsims code; engine.vectorbt is research
  "quantbox.engine._lag",
  "quantbox.engine.base",
  "quantbox.engine.book",
  "quantbox.engine.groups",
  "quantbox.engine.policy",
  "quantbox.engine.registry",
  "quantbox.engine.rsims",
  "quantbox.engine.rsims_sim",
  "quantbox.engine.schedule",
  "quantbox.exceptions",
  "quantbox.execution",
  "quantbox.execution_schedule",
  "quantbox.explain",
  "quantbox.features",
  "quantbox.features.**",
  "quantbox.financing",
  "quantbox.frequency",
  "quantbox.funding_guard",
  "quantbox.gates",
  "quantbox.gates_cli",
  "quantbox.indicators",  # pure pandas indicators; imports nothing internal
  "quantbox.inference",
  "quantbox.instrument_calendar",
  "quantbox.llm_utils",  # event lines and schema checks; the runner imports it
  "quantbox.metrics",
  "quantbox.overlays",  # the overlay chaining contract; explain imports it
  "quantbox.params_schema",
  "quantbox.parquet_io",
  "quantbox.performance",  # a wrapper over metrics; quantbox-live imports it
  "quantbox.plugin_manifest",
  "quantbox.plugins.builtins",  # a string table, name -> "module:Class"; the registry resolves it
  "quantbox.registry",
  "quantbox.retry",  # stdlib retry helper; datasources (plugins) and brokers (trade) import it
  "quantbox.run_history",  # run-id timestamps; store and runner import it
  "quantbox.run_manifest",
  "quantbox.runner",
  "quantbox.schemas",
  "quantbox.store",
  "quantbox.strategy_runner",
  "quantbox.strict",  # capability registry; registry and runner import it
