# Monthly bumps for GitHub Actions + Python deps (weekly until Tom 26.10). Grouped to limit
# PR noise; security advisories still surface as individual PRs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Feature and chore work integrates on dev; main is release-only
    # (CLAUDE.md :: Shipping cycle). Without this, dependabot defaults to
    # the repository default branch (main) and every bump widens
    # main-ahead-of-dev until someone notices and merges main back.
    target-branch: "dev"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    # Feature and chore work integrates on dev; main is release-only
    # (CLAUDE.md :: Shipping cycle). Without this, dependabot defaults to
    # the repository default branch (main) and every bump widens
    # main-ahead-of-dev until someone notices and merges main back.
    target-branch: "dev"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-deps:
        patterns: ["*"]
