name: review-gate

# Fails a PR until an INDEPENDENT reviewer (a party other than the author) posts
# a verdict as a native GitHub review object. The standardized independent
# reviewer is qute-review[bot] (posted by the local cross-model review: codex /
# Code Reviewer / qute-review); a human reviewer who isn't the author also
# satisfies it. A self-review by the author never counts — so a builder cannot
# self-certify. (No branch protection on this plan, so this REPORTS red but
# can't hard-block; an agent-side guard + the GH pull-tick back it up.)
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    # ADR-0020: the BASE BRANCH decides. The expensive independent review
    # gates `main` only; PRs into `dev` get `ci.yml` (tests, lint) and
    # nothing else. A gate that fires on every feature PR trains people to
    # ignore it, at which point it protects nothing.
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  require-independent-reviewer:
    name: require-independent-reviewer
    # Skip while the PR is a draft. This is safe for one reason above all: a draft
    # PR CANNOT BE MERGED. That matters because GitHub counts an `if:`-skipped job
    # as SUCCESS for required checks — so the guard would be a real bypass on any
    # mergeable PR. It isn't here, and the gate re-fires on `ready_for_review`, the
    # moment the PR first becomes mergeable.
    # (Secondary: on `opened` no independent review can exist yet, so the gate could
    # only ever report "unfinished" dressed up as "unreviewed".)
    # Note `null == false` is true under Actions' loose equality, so an absent
    # `draft` field fails OPEN — the gate runs — rather than silently disabling.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check for an independent (non-author) reviewer verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # Tier stamped by the jimek conductor. Read from the event payload —
          # on labeled/unlabeled the payload carries the post-change label set.
          TIER_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # ── tier awareness (Jimek rigor doctrine, ADR-0005 §4) ──
          # `jimek-tier:trivial` requires NO independent review by doctrine
          # (auto-merge on green CI). The label is stamped by the jimek
          # conductor — a trusted writer, not PR-head content — so a PR cannot
          # stamp itself down a tier. standard/complex, and NO label at all
          # (a standalone or interactive PR), still require a review.
          case ",$TIER_LABELS," in
            *",jimek-tier:trivial,"*)
              echo "jimek-tier:trivial — no independent review required by doctrine. Gate passes."
              exit 0
              ;;
          esac

          # ── dataset-wiring exemption (twin of conductor.yml classify.trivial_globs) ──
          # A PR whose EVERY changed path is a `datasets.lock` re-pin needs no
          # independent review (Tom, 2026-09-18). Decided PATH-BY-PATH and
          # deliberately label-independent: a `data-refresh`-style label can be added
          # by anyone with write access, so a label alone would let a code PR wear it
          # past the gate — the same reason quantbox-datasets checks the diff and not
          # just the label. Never grants the exemption on a doubt: one path outside
          # the lock set, or an empty list, falls through to the review requirement
          # below, and a failing `gh api` aborts the step under `bash -e` (red, never
          # a pass). It carries no line budget, unlike the conductor's
          # `trivial_max_lines` — path-only is the whole check here.
          FILES=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          if [ -n "$FILES" ]; then
            TOTAL=$(printf '%s\n' "$FILES" | wc -l)
            # COUNT THE MATCHES, don't grep for the complement: `grep -v … || true`
            # swallows grep's exit 2 (a grep ERROR) exactly like its exit 1 (no
            # lines), and an empty "outside" list then reads as "all paths are
            # locks" — a could-not-check granting the exemption. Counting instead
            # means a grep error leaves MATCHED non-numeric, which the guard below
            # turns into -1, and -1 never equals TOTAL.
            MATCHED=$(printf '%s\n' "$FILES" | grep -c -E '(^|/)datasets\.lock$' || true)
            case "$MATCHED" in ''|*[!0-9]*) MATCHED=-1 ;; esac
            if [ "$MATCHED" -eq "$TOTAL" ]; then
              echo "dataset wiring only — all $TOTAL changed paths are datasets.lock. No independent review required. Gate passes."
              exit 0
            fi
            echo "not dataset-wiring-only ($MATCHED of $TOTAL paths are datasets.lock) — an independent review is still required."
          fi

          COUNT=$(gh api "repos/$REPO/pulls/$PR/reviews" \
            | jq --arg a "$AUTHOR" '[.[] | select((.state=="COMMENTED" or .state=="APPROVED" or .state=="CHANGES_REQUESTED") and .user.login != $a)] | length')
          echo "Independent (non-author) review objects on PR #$PR: $COUNT"
          if [ "${COUNT:-0}" -ge 1 ]; then
            echo "Gate satisfied — an independent reviewer (not the author) posted a verdict."
          else
            echo "::error::No INDEPENDENT reviewer verdict. A party other than the author must post one (qute-review[bot] via the local cross-model review, or another reviewer): gh pr review $PR --repo $REPO --comment --body \"codex: SHIP / SHIP-WITH-NITS / blocker …\""
            exit 1
          fi
