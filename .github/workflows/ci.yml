name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
        # Runs everything this env can run, INCLUDING `slow` — CI is the tier
        # that owns slow tests, which is what makes the pre-push hook's
        # `-m "not slow"` safe rather than a hole in coverage.
        #
        # The two markers below are excluded HERE, in the job, not in
        # pyproject's addopts: this job installs the base env, while
        # pipeline-smoke and canonical-reproductions need `--extra full` and
        # get their own jobs. Previously this exclusion lived in `addopts`,
        # which meant a bare local `pytest` silently skipped them too.
      - run: uv run pytest -q -m "not pipeline_smoke and not canonical_reproduction"

  pipeline-smoke:
    # L1 of the pipeline-correctness ladder. Catches the "pytest is green
    # but the pipeline can't load plugins" class of failure that unit tests
    # miss by design. Runs in <10s.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: '3.11'
      - run: uv sync --extra full
      - run: uv run pytest tests/pipeline/ -m pipeline_smoke -v

  canonical-reproductions:
    # L2 of the pipeline-correctness ladder. Runs end-to-end backtests on
    # the bundled synthetic fixture and diffs headline metrics against
    # committed goldens. Catches silent numerical drift from
    # pandas/vbt/numba bumps. Runs in ~30s.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: '3.11'
      - run: uv sync --extra full
      - run: uv run pytest tests/canonical_reproductions/ -m canonical_reproduction -v
