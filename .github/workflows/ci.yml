name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# uv's default 30s HTTP timeout let one slow wheel fetch (cffi, via ccxt in
# `--extra full`) fail pipeline-smoke before any test ran (run 36833635610).
env:
  UV_HTTP_TIMEOUT: "120"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The layer contracts (ADR-0010, TOM-1451): pyproject.toml [tool.importlinter].
      # tests/test_layer_map.py proves every module is in exactly one layer.
      - run: uv run lint-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
        # Runs everything this env can run, INCLUDING `slow` — CI is the tier
        # that owns slow tests, which is what makes the pre-push hook's
        # `-m "not slow"` safe rather than a hole in coverage.
        #
        # The two markers below are excluded HERE, in the job, not in
        # pyproject's addopts: this job installs the base env, while
        # pipeline-smoke and canonical-reproductions need `--extra full` and
        # get their own jobs. Previously this exclusion lived in `addopts`,
        # which meant a bare local `pytest` silently skipped them too.
      - run: uv run pytest -q -m "not pipeline_smoke and not canonical_reproduction"

  no-vectorbt:
    # The CLIENT SMOKE (TOM-1451; it began as TOM-1334's no-vectorbt check). A
    # base `quantbox` (no extras, no lockfile, no dev group) in a CLEAN venv must
    # carry none of vectorbt, numba, ccxt, duckdb, httpx, plotly; import every
    # core module; name the extra wherever one is missing; and run an rsims
    # backtest, also on a client pack installed through entry points. The
    # script header lists every step. The `test` job cannot prove this: its env
    # carries every library through the dev group.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: bash scripts/check_no_vectorbt.sh

  pipeline-smoke:
    # L1 of the pipeline-correctness ladder. Catches the "pytest is green
    # but the pipeline can't load plugins" class of failure that unit tests
    # miss by design. Runs in <10s.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - run: uv sync --extra full
      - run: uv run pytest tests/pipeline/ -m pipeline_smoke -v

  canonical-reproductions:
    # L2 of the pipeline-correctness ladder. Runs end-to-end backtests on
    # the bundled synthetic fixture and diffs headline metrics against
    # committed goldens. Catches silent numerical drift from
    # pandas/vbt/numba bumps. Runs in ~30s.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - run: uv sync --extra full
      - run: uv run pytest tests/canonical_reproductions/ -m canonical_reproduction -v

  before-after:
    # The PR's result at base and at head, diffed (TOM-2458; .hotl/compare.yml is the
    # plan, scripts/before_after.py the reader). No LLM: exit 0 identical, 1 differs or
    # the live shadow run is owed (summary.md says which), anything else could not run.
    # NOT a required check: making it one is Tom's call. On this GitHub-hosted runner
    # there is no quantbox-datasets clone (it is private), so a selected config that
    # reads a dataset by name is NOT AVAILABLE here and is not run. When the rest are
    # identical the script exits 3 (PARTIAL): the job passes with a warning naming the
    # configs not checked. 1 (differs, or the shadow run is owed) and 2 (could not run,
    # or no selected config can run here) stay red. A docs/tests-only PR exits 0.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the merge base and a worktree of it
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --extra full
      - name: before/after
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/before-after"
          rc=0
          uv run --no-sync python scripts/before_after.py "origin/$BASE_REF" "$out" || rc=$?
          if [ -s "$out/summary.md" ]; then cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$rc" -eq 3 ]; then
            echo "::warning title=before/after PARTIAL::not checked on this runner (dataset not available): $(cat "$out/not_checked.txt" 2>/dev/null || echo 'see the job summary')"
            exit 0
          fi
          exit "$rc"

  datasets-lock-check:
    # Least privilege, as the sibling workflows declare it: this job consumes a
    # secret, and ci.yml as a whole declares no permissions.
    permissions:
      contents: read
    # `secrets` is NOT available in a step-level `if`, and using it there fails the
    # whole workflow's parse — so the token is lifted into a job-level env var and the
    # steps below condition on that.
    env:
      HAS_DEPS_PAT: ${{ secrets.GH_DEPS_PAT != '' }}
    # A PR that only touches datasets.lock is the trivial rigor tier and skips the
    # review gate, so this is the only thing that reads the file it changed. The
    # catalog is fetched (not cloned): it is the one file the name check needs, and
    # the datasets themselves are far too large to pull on every PR — so the check
    # runs in its no-root mode here and says so in its output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - run: uv sync
      # Best-effort: fork and Dependabot PRs have no secret at all, and a token that
      # has expired or lost access to quantbox-datasets 401s (it does today, which is
      # why this does not hard-fail: an unrelated PR must not go red over a secret
      # rotation). Whether it landed decides the mode, and the step below says which.
      - name: Fetch quantbox-datasets catalog
        if: env.HAS_DEPS_PAT == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          curl -sSfL --retry 3 --retry-all-errors \
            -H "Authorization: token $GH_DEPS_PAT" \
            -H "Accept: application/vnd.github.raw" \
            -o "$RUNNER_TEMP/quantbox-datasets-catalog.yaml" \
            https://api.github.com/repos/tomlupo/quantbox-datasets/contents/catalog.yaml
        env:
          GH_DEPS_PAT: ${{ secrets.GH_DEPS_PAT }}
      - name: datasets.lock check
        run: |
          set -euo pipefail
          if [ -f "$QUANTBOX_DATASETS_CATALOG" ]; then
            uv run python scripts/check_datasets_lock.py --require-catalog
          else
            echo "::warning::No catalog fetched (no GH_DEPS_PAT on this PR, or the token cannot read tomlupo/quantbox-datasets) — the name stage will report SKIPPED and only the lock syntax is checked. Refresh GH_DEPS_PAT to turn the name stage back on."
            uv run python scripts/check_datasets_lock.py
          fi
        env:
          QUANTBOX_DATASETS_CATALOG: ${{ runner.temp }}/quantbox-datasets-catalog.yaml
