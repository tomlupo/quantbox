run:
  mode: paper
  asof: "2026-01-31"
  pipeline: "trade.allocations_to_orders.v1"

artifacts:
  root: "./artifacts"

plugins:
  pipeline:
    name: "trade.allocations_to_orders.v1"
    params:
      allocations_path: "./artifacts/<FUND_RUN_ID>/allocations.parquet"
      instrument_map: "./config/instruments.yaml"
      prices:
        lookback_days: 5

  data:
    name: "local_file_data"
    params_init:
      prices_path: "./data/curated/prices.parquet"
      fx_path: "./data/curated/fx.parquet"

  broker:
    name: "ibkr.paper.stub.v1"
    # The paper stub simulates fills in memory. For a real IBKR paper account use
    # ibkr.live.v1 with host / port (7497) / client_id / account / readonly.
    params_init:
      starting_cash_usd: 100000

  publishers: []
  risk: []
