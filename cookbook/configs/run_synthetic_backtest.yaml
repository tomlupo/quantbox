# Backtest on synthetic data — no external API calls needed.
# Useful for CI pipelines, strategy prototyping, and testing.
#
# Usage: quantbox run -c cookbook/configs/run_synthetic_backtest.yaml

run:
  mode: backtest
  asof: "2026-02-01"
  pipeline: backtest.pipeline.v1

artifacts:
  root: "./artifacts"

plugins:
  pipeline:
    name: backtest.pipeline.v1
    params:
      engine: vectorbt
      fees: 0.001
      rebalancing_policy: {cadence: periodic, frequency: 5}  # every 5th execution bar
      trading_days: 252
      # data.synthetic.v1 reads its knobs at load time: n_assets / symbols in
      # load_universe(), the rest in load_market_data(). plugins.data.params is never read.
      universe:
        n_assets: 10
      prices:
        n_steps: 504
        model: jump_diffusion
        model_params:
          mu: 0.08
          sigma: 0.20
          jump_intensity: 5.0
          jump_mean: -0.02
          jump_std: 0.03
        correlation: random
        initial_price: 100.0
        random_state: 42

  strategies:
    - name: strategy.portfolio_optimizer.v1
      weight: 1.0
      params:
        method: max_sharpe
        lookback: 120
        risk_free_rate: 0.04

  data:
    name: data.synthetic.v1

  broker:
    name: sim.paper.v1
    params_init: {}
